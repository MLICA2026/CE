<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TCF-CE Série 50 – Compréhension écrite</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#f5f4f0;color:#1a1a1a;padding:1rem}
#app{max-width:860px;margin:0 auto}
.header{display:flex;align-items:center;justify-content:space-between;background:#fff;border:1px solid #e0ddd5;border-radius:12px;padding:1rem 1.25rem;margin-bottom:1.25rem}
.header img{height:48px;object-fit:contain}
.header-right{text-align:right}
.header-title{font-size:16px;font-weight:700;color:#1a1a1a}
.header-sub{font-size:12px;color:#888;margin-top:2px}
.prog-bar{height:5px;background:#e0ddd5;border-radius:3px;margin-bottom:4px}
.prog-fill{height:100%;background:#1D9E75;border-radius:3px;transition:width .35s}
.prog-labels{display:flex;justify-content:space-between;font-size:11px;color:#888;margin-bottom:1rem}
.nav{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:.85rem}
.btn{padding:7px 14px;border-radius:8px;border:1px solid #d0cdc5;background:#fff;cursor:pointer;font-size:13px;font-weight:500;color:#444}
.btn:hover{background:#f5f4f0}
.btn-results{margin-left:auto;border-color:#0F6E56;color:#0F6E56;font-weight:600;background:#fff}
.btn-results:hover{background:#e8f7f2}
.card{background:#fff;border:1px solid #e0ddd5;border-radius:12px;padding:1.25rem;margin-bottom:1rem}
.textbox{background:#f8f7f3;border-left:3px solid #1D9E75;border-radius:0 8px 8px 0;padding:1rem 1.25rem;margin-bottom:1.1rem;font-size:15px;line-height:1.85;color:#1a1a1a;width:100%;box-sizing:border-box}
.textbox mark{background:#FAC775;color:#412402;border-radius:3px;padding:1px 3px;font-style:normal}
.question{font-size:16px;font-weight:600;margin-bottom:.9rem}
.choices{display:flex;flex-direction:column;gap:8px}
.choice{padding:11px 15px;border:1px solid #d0cdc5;border-radius:8px;cursor:pointer;font-size:14px;display:flex;align-items:center;gap:10px;background:#fff;width:100%;box-sizing:border-box;text-align:left;transition:background .15s,border-color .15s}
.choice:hover:not(.correct):not(.wrong){background:#f5f4f0}
.choice .badge{font-weight:600;min-width:22px;flex-shrink:0}
.choice.correct{border-color:#0F6E56;background:#E1F5EE;color:#085041}
.choice.wrong{border-color:#993C1D;background:#FAECE7;color:#4A1B0C}
.feedback{border-radius:8px;padding:10px 14px;margin-top:.85rem;font-size:14px}
.feedback.ok{background:#E1F5EE;color:#085041;border:1px solid #5DCAA5}
.feedback.ko{background:#FAECE7;color:#4A1B0C;border:1px solid #F0997B}
.key-label{display:inline-block;background:#FEF3C7;color:#92400E;border:1px solid #FCD34D;border-radius:6px;padding:3px 10px;font-size:12px;margin-bottom:.75rem}
/* Summary */
.summary{background:#fff;border:1px solid #e0ddd5;border-radius:12px;padding:1.5rem}
.summary h2{font-size:20px;font-weight:700;margin-bottom:1.25rem;text-align:center}
.score-block{text-align:center;margin-bottom:1.5rem}
.score-correct{font-size:32px;font-weight:700;color:#1D9E75}
.score-tcf{font-size:22px;font-weight:600;margin-top:.5rem;color:#1a1a1a}
.score-nclc{font-size:28px;font-weight:700;color:#BA7517;margin-top:.4rem}
.score-msg{font-size:14px;color:#555;margin-top:.5rem}
.grid{display:flex;flex-wrap:wrap;gap:6px;margin:1.25rem 0}
.grid-btn{width:36px;height:36px;border-radius:6px;border:none;cursor:pointer;font-size:12px;font-weight:600;color:#fff}
.grid-btn.ok{background:#1D9E75}
.grid-btn.ko{background:#993C1D}
.grid-btn.na{background:#bbb;color:#fff}
.sum-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:1rem}
.sum-btn{padding:9px 18px;border-radius:8px;border:1px solid #0F6E56;color:#0F6E56;font-weight:600;background:#fff;cursor:pointer;font-size:14px}
.sum-btn:hover{background:#e8f7f2}
.sum-btn.red{border-color:#993C1D;color:#993C1D}
.sum-btn.red:hover{background:#FAECE7}
.sum-note{font-size:11px;color:#888;margin-top:.75rem}
/* Report */
.report-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.25rem}
.report-item{border:1px solid #e0ddd5;border-radius:10px;padding:1rem;margin-bottom:1rem;background:#fff}
.report-item .qnum{font-size:11px;color:#888;margin-bottom:.5rem}
.report-choice{padding:8px 12px;border-radius:6px;font-size:13px;margin-top:5px;display:flex;gap:8px;align-items:center}
.report-choice.correct{background:#E1F5EE;color:#085041;border:1px solid #5DCAA5}
.report-choice.wrong{background:#FAECE7;color:#4A1B0C;border:1px solid #F0997B}
.report-choice.neutral{background:#f5f4f0;color:#555;border:1px solid #e0ddd5}
</style>
</head>

<script>
var QQ = JSON.parse(document.getElementById("qdata").textContent);
var ans = {};
var cur = 0;

function getPoints(i) {
  var n = i + 1;
  if (n <= 4)  return 3;
  if (n <= 10) return 9;
  if (n <= 19) return 15;
  if (n <= 29) return 21;
  if (n <= 35) return 26;
  return 33;
}

function getNclc(score) {
  if (score >= 549) return { level: "NCLC 10+", msg: "Excellent ! Niveau NCLC 10 et plus." };
  if (score >= 524) return { level: "NCLC 9",   msg: "Très bien ! Niveau NCLC 9." };
  if (score >= 499) return { level: "NCLC 8",   msg: "Très bien ! Niveau NCLC 8." };
  if (score >= 453) return { level: "NCLC 7",   msg: "Objectif immigration atteint ! Niveau NCLC 7." };
  if (score >= 406) return { level: "NCLC 6",   msg: "Encore un peu d'effort pour atteindre le NCLC 7 !" };
  if (score >= 375) return { level: "NCLC 5",   msg: "Continuez à pratiquer, niveau NCLC 5." };
  if (score >= 342) return { level: "NCLC 4",   msg: "Continuez à pratiquer, niveau NCLC 4." };
  return { level: "En dessous de NCLC 4", msg: "Continuez à pratiquer !" };
}

function esc(s) {
  var t = String(s);
  t = t.replace(/&/g, "&amp;");
  t = t.replace(/</g, "&lt;");
  t = t.replace(/>/g, "&gt;");
  return t;
}

function hl(text, key) {
  var h = esc(text).split("\n").join("<br>");
  var keys = Array.isArray(key) ? key : (key ? [key] : []);
  for (var i = 0; i < keys.length; i++) {
    try {
      var ek = esc(keys[i]);
      if (!ek) continue;
      var idx = h.toLowerCase().indexOf(ek.toLowerCase());
      if (idx >= 0) {
        h = h.substring(0, idx) + "<mark>" + h.substring(idx, idx + ek.length) + "</mark>" + h.substring(idx + ek.length);
      }
    } catch(e) {}
  }
  return h;
}

function updateHeader() {
  var ok = 0, score = 0;
  for (var k in ans) { if (ans[k].ok) { ok++; score += getPoints(parseInt(k)); } }
  document.getElementById("hdr-sub").textContent = "39 questions · " + score + " pt";
  var pct = Math.round((Object.keys(ans).length / QQ.length) * 100);
  document.getElementById("prog").style.width = pct + "%";
  document.getElementById("pleft").textContent = "Question " + (cur + 1) + " / 39";
  document.getElementById("pright").textContent = pct + "% complété";
}

function render(i) {
  cur = i;
  var q = QQ[i];
  var ua = ans[i];
  var done = ua !== undefined;
  var textHtml = done ? hl(q.t, q.k) : esc(q.t).split("\n").join("<br>");
  var keyLabel = done ? "<div class=\"key-label\">🔑 Phrase-clé surlignée</div>" : "";

  var labels = ["A", "B", "C", "D"];
  var choicesHtml = "";
  for (var ci = 0; ci < q.c.length; ci++) {
    var cls = "choice";
    if (done) {
      if (ci === q.a) cls += " correct";
      else if (ua.choice === ci) cls += " wrong";
    }
    choicesHtml += "<button class=\"" + cls + "\" onclick=\"pick(" + i + "," + ci + ")\">" +
      "<span class=\"badge\">" + labels[ci] + "</span><span>" + esc(q.c[ci]) + "</span></button>";
  }

  var feedbackHtml = "";
  if (done) {
    if (ua.ok) {
      feedbackHtml = "<div class=\"feedback ok\">✅ Bonne réponse !</div>";
    } else {
      feedbackHtml = "<div class=\"feedback ko\">❌ Réponse incorrecte. La bonne réponse est <strong>" + labels[q.a] + ". " + esc(q.c[q.a]) + "</strong></div>";
    }
  }

  var prevDisabled = i === 0 ? " disabled" : "";
  var nextDisabled = i === QQ.length - 1 ? " disabled" : "";

  document.getElementById("view").innerHTML =
    "<div class=\"nav\">" +
      "<button class=\"btn\"" + prevDisabled + " onclick=\"render(" + (i-1) + ")\">← Précédente</button>" +
      "<button class=\"btn\"" + nextDisabled + " onclick=\"render(" + (i+1) + ")\">Suivante →</button>" +
      "<button class=\"btn btn-results\" onclick=\"summary()\">Résultats</button>" +
    "</div>" +
    "<div class=\"card\">" +
      keyLabel +
      "<div class=\"textbox\">" + textHtml + "</div>" +
      "<div class=\"question\">Q" + (i+1) + ". " + esc(q.q) + "</div>" +
      "<div class=\"choices\">" + choicesHtml + "</div>" +
      feedbackHtml +
    "</div>";

  updateHeader();
}

function pick(qi, ci) {
  if (ans[qi] !== undefined) return;
  ans[qi] = { choice: ci, ok: ci === QQ[qi].a };
  render(qi);
}

function calcScore() {
  var ok = 0, score = 0;
  for (var k in ans) { if (ans[k].ok) { ok++; score += getPoints(parseInt(k)); } }
  return { ok: ok, score: score };
}

function summary() {
  var r = calcScore();
  var nclc = getNclc(r.score);
  var gridHtml = "";
  for (var i = 0; i < QQ.length; i++) {
    var cls = "grid-btn na";
    var ua = ans[i];
    if (ua !== undefined) cls = ua.ok ? "grid-btn ok" : "grid-btn ko";
    gridHtml += "<button class=\"" + cls + "\" onclick=\"render(" + i + ")\" title=\"Q" + (i+1) + "\">" + (i+1) + "</button>";
  }

  document.getElementById("view").innerHTML =
    "<div class=\"summary\">" +
      "<h2>📊 Résultats</h2>" +
      "<div class=\"score-block\">" +
        "<div class=\"score-correct\">" + r.ok + " / 39 ✓</div>" +
        "<div class=\"score-tcf\">Score TCF estimé : <strong>" + r.score + "</strong> / 699</div>" +
        "<div class=\"score-nclc\">" + nclc.level + "</div>" +
        "<div class=\"score-msg\">" + nclc.msg + "</div>" +
      "</div>" +
      "<div class=\"grid\">" + gridHtml + "</div>" +
      "<div class=\"sum-actions\">" +
        "<button class=\"sum-btn\" onclick=\"showReport()\">📋 Voir le rapport des erreurs</button>" +
        "<button class=\"sum-btn red\" onclick=\"reset()\">↺ Recommencer</button>" +
      "</div>" +
      "<div class=\"sum-note\">* Score estimatif à titre indicatif</div>" +
    "</div>";

  updateHeader();
}

function showReport() {
  var itemsHtml = "";
  var labels = ["A", "B", "C", "D"];
  for (var i = 0; i < QQ.length; i++) {
    var ua = ans[i];
    if (!ua || ua.ok) continue;
    var q = QQ[i];
    var textHtml = hl(q.t, q.k);
    var choicesHtml = "";
    for (var ci = 0; ci < q.c.length; ci++) {
      var cls = "report-choice neutral";
      var icon = "";
      if (ci === q.a) { cls = "report-choice correct"; icon = "✓ "; }
      else if (ua.choice === ci) { cls = "report-choice wrong"; icon = "✗ "; }
      choicesHtml += "<div class=\"" + cls + "\"><strong>" + labels[ci] + ".</strong> " + icon + esc(q.c[ci]) + "</div>";
    }
    itemsHtml +=
      "<div class=\"report-item\">" +
        "<div class=\"qnum\">Question " + (i+1) + "</div>" +
        "<div class=\"key-label\" style=\"margin-bottom:.6rem\">🔑 Phrase-clé surlignée</div>" +
        "<div class=\"textbox\">" + textHtml + "</div>" +
        "<div class=\"question\" style=\"font-size:14px;margin-bottom:.6rem\">" + esc(q.q) + "</div>" +
        choicesHtml +
      "</div>";
  }

  if (!itemsHtml) {
    itemsHtml = "<div style=\"text-align:center;padding:2rem;color:#1D9E75;font-weight:600\">🎉 Aucune erreur ! Bravo !</div>";
  }

  document.getElementById("view").innerHTML =
    "<div class=\"report-header\">" +
      "<strong style=\"font-size:16px\">📋 Rapport des erreurs</strong>" +
      "<button class=\"btn btn-results\" onclick=\"summary()\">← Retour aux résultats</button>" +
    "</div>" +
    itemsHtml;
}

function reset() {
  ans = {};
  render(0);
}

window.onload = function() { render(0); };
</script>

    if (k) { var ek = x(k), i = h.toLowerCase().indexOf(ek.toLowerCase());
      if (i >= 0) h = h.slice(0, i) + "<mark>" + h.slice(i, i + ek.length) + "</mark>" + h.slice(i + ek.length); }
    return h.split("\n").join("<br>");
  }
  function logoSrc() {
    if (typeof LOGO_SRC !== "undefined") return LOGO_SRC;
    var im = document.querySelector("img[src^='data:image']");
    return im ? im.src : "";
  }
  function title() {
    var t = document.querySelector(".header-title");
    return t ? t.textContent.trim() : (document.title || "Compréhension écrite");
  }
  window.mliExportPDF = function () {
    var L = ["A","B","C","D"], ok = 0, rows = "";
    var score = null, lvTxt = "";
    try { if (typeof calcScore === "function") { var cs = calcScore(); if (cs && cs.score !== undefined) score = cs.score; } } catch (e) {}
    if (score === null) {
      var pf = typeof getPoints === "function" ? getPoints : (typeof pts === "function" ? pts : null);
      if (pf) { score = 0; for (var k in ans) if (ans[k].ok) score += pf(parseInt(k)); }
    }
    try {
      var nf = typeof getNclc === "function" ? getNclc : (typeof nclc === "function" ? nclc : null);
      if (nf && score !== null) { var nn = nf(score); lvTxt = nn.level || nn.l || ""; }
    } catch (e) {}
    if (score === null) score = "—";
    var lv = lvTxt ? [lvTxt, lvTxt] : null;
    for (var i = 0; i < QQ.length; i++) {
      var q = QQ[i], ua = ans[i], done = ua !== undefined;
      if (done && ua.ok) ok++;
      var ch = "";
      for (var c = 0; c < q.c.length; c++) {
        var cls = "neutral", ic = "";
        if (done) { if (c === q.a) { cls = "correct"; ic = "✓ "; } else if (ua.choice === c) { cls = "wrong"; ic = "✗ "; } }
        ch += "<div class='ch " + cls + "'><strong>" + L[c] + ".</strong> " + ic + x(q.c[c]) + "</div>";
      }
      var badge = done ? (ua.ok ? " ✅" : " ❌ (→" + L[q.a] + ")") : " —";
      rows += "<div class='item'><div class='qn'>Q" + (i + 1) + badge + "</div>" +
        "<div class='psg'>" + hi(q.t, q.k) + "</div>" +
        "<div class='qq'>" + x(q.q) + "</div>" + ch + "</div>";
    }
    var html = '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>' + x(title()) + ' – Rapport complet</title><style>' +
      "body{font-family:'Segoe UI',system-ui,sans-serif;color:#1a1a1a;padding:1.5rem;max-width:860px;margin:0 auto;font-size:13px}" +
      ".ph{display:flex;align-items:center;gap:1.5rem;border-bottom:2px solid #185FA5;padding-bottom:1rem;margin-bottom:1.5rem}.ph img{height:48px}" +
      ".ph h1{font-size:18px;color:#185FA5;margin:0}.ph p{font-size:12px;color:#666;margin:3px 0 0}" +
      ".ss{background:#E6F1FB;border-radius:8px;padding:1rem 1.5rem;margin-bottom:1.5rem;display:flex;gap:2rem;align-items:center}" +
      ".big{font-size:28px;font-weight:700;color:#185FA5}.lv{font-size:22px;font-weight:700;color:#BA7517}" +
      ".item{border:1px solid #e0ddd5;border-radius:8px;padding:.75rem;margin-bottom:.75rem;page-break-inside:avoid}" +
      ".qn{font-size:12px;font-weight:700;color:#185FA5;margin-bottom:.4rem}" +
      ".psg{background:#f7f6f2;border-left:3px solid #B5D4F4;padding:.5rem .8rem;font-size:12px;line-height:1.6;margin-bottom:.5rem}" +
      ".psg mark{background:#FAC775;color:#412402;padding:1px 2px;border-radius:2px}" +
      ".qq{font-weight:600;font-size:13px;margin-bottom:.5rem}" +
      ".ch{padding:5px 10px;border-radius:5px;font-size:12px;margin-bottom:4px}.neutral{background:#f5f4f0}" +
      ".correct{background:#E1F5EE;color:#085041;font-weight:600}.wrong{background:#FAECE7;color:#4A1B0C}" +
      "*{-webkit-print-color-adjust:exact;print-color-adjust:exact}@media print{body{padding:0}.np{display:none}}" +
      "</style></head><body>" +
      "<div class='ph'>" + (logoSrc() ? "<img src='" + logoSrc() + "' alt='MLI'>" : "") +
      "<div><h1>" + x(title()) + "</h1><p>Rapport complet · " + new Date().toLocaleDateString("fr-CA") + "</p></div></div>" +
      "<div class='ss'><div><div class='big'>" + ok + " / " + QQ.length + " ✓</div>" +
      "<div>Score TCF estimé : <strong>" + score + "</strong> / 699</div></div>" +
      (lv ? "<div class='lv'>" + x(lv[1]) + "</div>" : "") + "</div>" + rows +
      "<p style='font-size:10px;color:#aaa;text-align:center;margin-top:2rem'>* Score estimatif – l'Institut de langues de Montréal</p>" +
      "<div class='np' style='text-align:center;margin-top:1rem'><button onclick='window.print()' style='padding:8px 20px;background:#185FA5;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:14px'>🖨️ Imprimer / Enregistrer en PDF</button></div>" +
      "</body></html>";
    var pw = mliPrintWin();
    pw.document.open(); pw.document.write(html); pw.document.close();
    if (__mliFrame) mliAfterWrite(pw);
    else setTimeout(function () { try { pw.focus(); pw.print(); } catch (e) {} }, 500);
  };
  function addBtn() {
    var old = document.getElementById("mli-pdf-btn");
    if (old && old.offsetParent !== null) return;
    if (old) old.parentNode.removeChild(old);
    var all = document.querySelectorAll("[onclick^='showReport']"), rep = null;
    for (var j = 0; j < all.length; j++) { if (all[j].offsetParent !== null) { rep = all[j]; break; } }
    if (!rep) rep = all[0];
    if (!rep) return;
    var b = rep.cloneNode(false);
    b.id = "mli-pdf-btn";
    b.removeAttribute("onclick");
    b.onclick = window.mliExportPDF;
    b.textContent = "🖨️ Exporter PDF";
    b.style.cssText += ";border-color:#639922;color:#3B6D11;background:#EAF3DE";
    rep.parentNode.insertBefore(b, rep.nextSibling);
  }
  var orig = window.summary;
  if (typeof orig === "function") {
    window.summary = function () { var r = orig.apply(this, arguments); try { addBtn(); } catch (e) {} return r; };
  }
})();
</script>

<script>
/* MLI – Export PDF sur la page d'erreurs et le vocabulaire (ajouté 2026-11) */
(function () {
  function openWin() {
    var w = null;
    try { w = window.open("", "_blank"); } catch (e) { w = null; }
    if (w && w.document) return { w: w, frame: false };
    var old = document.getElementById("mli-print-frame2"); if (old) old.parentNode.removeChild(old);
    var f = document.createElement("iframe"); f.id = "mli-print-frame2";
    f.style.cssText = "position:fixed;right:0;bottom:0;width:1px;height:1px;border:0;opacity:0";
    document.body.appendChild(f);
    return { w: f.contentWindow, frame: true };
  }
  function writeAndPrint(html) {
    var o = openWin();
    o.w.document.open(); o.w.document.write(html); o.w.document.close();
    setTimeout(function () { try { o.w.focus(); o.w.print(); } catch (e) {} }, 500);
  }
  function pageTitle() {
    var t = document.getElementById("hdr-title") || document.querySelector(".header-title");
    return t ? t.textContent.trim() : document.title;
  }
  function logoSrc() {
    if (typeof LOGO_SRC !== "undefined") return LOGO_SRC;
    var im = document.querySelector("img[src^='data:image']"); return im ? im.src : "";
  }
  // Imprime la vue courante (vocabulaire) avec les styles de la page
  window.mliPrintView = function () {
    var css = ""; var st = document.querySelectorAll("style");
    for (var i = 0; i < st.length; i++) css += st[i].textContent + "\n";
    var v = document.getElementById("view"); if (!v) return;
    var lg = logoSrc();
    writeAndPrint('<!DOCTYPE html><html><head><meta charset="UTF-8"><title>' + pageTitle() + '</title><style>' + css +
      "body{background:#fff!important;padding:1.2rem}.nav,.mli-pdf2,#zoombar{display:none!important}" +
      "*{-webkit-print-color-adjust:exact;print-color-adjust:exact}.voc-item,.report-item,.report-q{page-break-inside:avoid}" +
      "</style></head><body><div style='display:flex;align-items:center;gap:1rem;border-bottom:2px solid #185FA5;padding-bottom:.8rem;margin-bottom:1rem'>" +
      (lg ? "<img src='" + lg + "' style='height:44px'>" : "") +
      "<div><div style='font-size:17px;font-weight:700;color:#185FA5'>" + pageTitle() + "</div><div style='font-size:11px;color:#666'>" +
      new Date().toLocaleDateString("fr-CA") + "</div></div></div>" + v.innerHTML + "</body></html>");
  };
  function makeBtn(onclick) {
    var b = document.createElement("button");
    b.className = "mli-pdf2"; b.type = "button"; b.textContent = "🖨️ Exporter PDF";
    b.style.cssText = "margin:0 0 .8rem .5rem;padding:7px 16px;border:1px solid #639922;color:#3B6D11;background:#EAF3DE;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit";
    b.onclick = onclick; return b;
  }
  function visible(sel) {
    var a = document.querySelectorAll(sel);
    for (var i = 0; i < a.length; i++) if (a[i].offsetParent !== null) return a[i];
    return null;
  }
  function addAfterAnchor(anchorSel, onclick) {
    var old = document.querySelectorAll(".mli-pdf2");
    for (var i = 0; i < old.length; i++) old[i].parentNode.removeChild(old[i]);
    var a = visible(anchorSel), b = makeBtn(onclick);
    if (a) { b.style.margin = '0 0 0 .5rem'; b.style.verticalAlign = 'middle'; a.parentNode.insertBefore(b, a.nextSibling); return; }
    var box = visible("#report") || document.getElementById("view");
    if (box) box.insertBefore(b, box.firstChild);
  }
  function reportPDF() {
    if (typeof window.mliExportPDF === "function") return window.mliExportPDF();
    if (typeof window.printPDF === "function") return window.printPDF();
    window.mliPrintView();
  }
  function wrap(name, after) {
    var o = window[name];
    if (typeof o !== "function") return;
    window[name] = function () { var r = o.apply(this, arguments); try { after(); } catch (e) {} return r; };
  }
  wrap("showReport", function () { addAfterAnchor("[onclick^='summary']", reportPDF); });
  wrap("showVocab", function () { addAfterAnchor("[onclick^='showLevelSelect']", window.mliPrintView); });
})();
</script>
